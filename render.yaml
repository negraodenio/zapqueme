services:
  - type: web
    name: zapqueme-bot
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: OPENROUTER_MODEL
        value: google/gemini-2.0-flash-001
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_BACKUP
        sync: false
      - key: ALLOW_GEMINI_FALLBACK
        value: "false"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: SMS_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_SESSION_ENCRYPTION_KEY
        sync: false
      - key: AUTO_PAIRING
        value: "false"
      - key: WHATSAPP_MESSAGES_PER_MINUTE
        value: "12"
      - key: WHATSAPP_PHONE
        sync: false
